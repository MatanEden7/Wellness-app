# Area tags for the regression suite.
#
# Every regression test file declares the area(s) it covers with a library-level
# `@Tags([...])`. That lets you run just the tests for the area you touched:
#
#     flutter test test/ --tags calendar
#     flutter test test/ --tags persistence
#     flutter test test/ --tags "calendar || notifications"
#     flutter test test/ --exclude-tags slow
#
# Which tag to run after a change -- see TESTING.md for the full table:
#
#   calendar      lib/features/calendar/**            (recurrence, occurrences, agenda)
#   persistence   lib/data/db/**, backup/export       (snapshot, import/export, backup)
#   nutrition     lib/features/meals/domain/**        (unit math, macros)
#   integrity     lib/data/db/drift_database.dart     (cascades, id caches, streams)
#   i18n          lib/l10n/**, displayName()          (translations, bilingual fields)
#   catalog       seeded starter content              (foods, exercises, templates)
#   notifications lib/services/notification_*.dart     (actions, routing, snooze, payloads)
#   profile       lib/services/setup_engine_service.dart, lib/features/settings/**, onboarding
#                 (BMR/TDEE/target formulas, profile/settings screens, profile<->preferences sync)
#   ui            lib/core/theme.dart, shared widgets    (theming, contrast, visual consistency)
tags:
  calendar:
  persistence:
  nutrition:
  integrity:
  i18n:
  catalog:
  notifications:
  profile:
  ui:
