name: wellness_app
description: A local-first wellness app for meals, workouts, and sleep tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  hooks_riverpod: 2.4.9
  flutter_hooks: 0.20.3
  
  # Navigation
  go_router: 12.1.3
  
  # Database
  drift: 2.14.1
  sqlite3_flutter_libs: 0.5.15
  sqlite3: 2.4.5
  ffi: ^2.1.0
  
  # Code Generation
  freezed_annotation: 2.4.1
  json_annotation: 4.8.1
  
  # Notifications & Haptics
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  flutter_native_timezone: ^2.0.0
  # vibration: ^2.0.0  # Temporarily disabled due to win32 compatibility issue
  
  # Audio
  just_audio: ^0.9.36
  
  # UI & Assets
  flutter_svg: 2.0.9
  
  # Utilities
  intl: ^0.20.2
  uuid: 4.2.1
  path_provider: 2.1.1
  path: ^1.9.0
  shared_preferences: ^2.2.2
  share_plus: ^7.2.1
  file_picker: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 3.0.1
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0
  
  # Code Generation
  build_runner: 2.4.9
  drift_dev: 2.14.1
  freezed: 2.4.6
  json_serializable: 6.7.1

flutter:
  uses-material-design: true
  generate: true
  
dependency_overrides:
  # file_picker's Windows implementation transitively pins win32 5.2.0, whose
  # guid.dart references `UnmodifiableUint8ListView` -- removed from
  # dart:typed_data in the SDK this project's Flutter version (3.44.8)
  # bundles. Irrelevant at runtime (this app never targets Windows) but the
  # kernel compiler still resolves every package in the graph regardless of
  # target platform, so an incompatible transitive version breaks iOS/Android
  # builds too. Overridden to a version built against a current SDK.
  win32: ^5.5.4
