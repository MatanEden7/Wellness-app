# Wellness App Setup Engine Spec (HE/EN-ready)
# This file defines: pre-dialog fields, formulas, macro targets by % + g/kg,
# workout templates (sets/reps), mobility/rehab packs, and meal templates.
# Variables use {{snake_case}} to reference user inputs or computed values.

version: 1.0.0
locale_support:
  - en
  - he

pre_dialog_fields:
  - key: sex
    type: enum
    options: [male, female]
  - key: age_years
    type: int
    min: 12
    max: 99
  - key: height_cm
    type: int
    min: 120
    max: 220
  - key: weight_kg
    type: float
    min: 35
    max: 250
  - key: goal
    type: enum
    options: [fat_loss, muscle_gain, maintenance, mobility_rehab]
  - key: activity_level
    type: enum
    options:
      - sedentary      # 1.2
      - light          # 1.375
      - moderate       # 1.55
      - active         # 1.725
      - very_active    # 1.9
  - key: training_days_per_week
    type: int
    min: 2
    max: 6
  - key: equipment
    type: multiselect
    options: [none, dumbbells, barbell_rack, machines, bands, kettlebells, cable, pullup_bar]
  - key: diet_type
    type: enum
    options: [omnivore, carnivore, herbivore]
  - key: meal_count_per_day
    type: enum
    options: [2,3,4,intermittent_fasting_16_8]
  - key: exclusions
    type: multiselect
    options: [none, dairy, gluten, nuts, eggs, shellfish, soy]
  - key: injuries
    type: multiselect
    options: [none, shoulder, back, knee, ankle, elbow, hip]
  - key: units
    type: object
    fields:
      energy: [kcal, kJ]
      weight: [g, oz]

formulae:
  # Basal Metabolic Rate (Mifflin-St Jeor)
  bmr:
    male: 10*{{weight_kg}} + 6.25*{{height_cm}} - 5*{{age_years}} + 5
    female: 10*{{weight_kg}} + 6.25*{{height_cm}} - 5*{{age_years}} - 161
  activity_factor:
    sedentary: 1.2
    light: 1.375
    moderate: 1.55
    active: 1.725
    very_active: 1.9
  tdee: "{{bmr}} * {{activity_factor}}"

  calorie_targets_kcal:
    fat_loss: "{{tdee}} - 400"         # moderate deficit
    muscle_gain: "{{tdee}} + 250"      # lean bulk
    maintenance: "{{tdee}}"
    mobility_rehab: "{{tdee}}"

  # Macro rules: protein g/kg; min fat g/kg; carbs fill remainder by percent.
  macro_rules:
    protein_g_per_kg:
      fat_loss: 2.2
      muscle_gain: 2.0
      maintenance: 1.8
      mobility_rehab: 1.6
    fat_min_g_per_kg: 0.6
    # Percent allocations used for chip/progress visuals (approx target distribution)
    percent_defaults:
      fat_loss: {protein_pct: 35, fat_pct: 30, carbs_pct: 35}
      muscle_gain: {protein_pct: 30, fat_pct: 25, carbs_pct: 45}
      maintenance: {protein_pct: 25, fat_pct: 30, carbs_pct: 45}
      mobility_rehab: {protein_pct: 25, fat_pct: 35, carbs_pct: 40}

  # Macro calculation (pseudocode evaluated in app):
  # protein_g = protein_g_per_kg[goal] * weight_kg
  # fat_g_min = fat_min_g_per_kg * weight_kg
  # calories_from_protein = protein_g * 4
  # calories_from_fat_min = fat_g_min * 9
  # remaining_calories = calorie_target_kcal - calories_from_protein - calories_from_fat_min
  # carbs_g = max(0, remaining_calories / 4)  # or clamp by percent_defaults if preferred
  # fat_g = fat_g_min  # can increase to hit percent_defaults if desired

meal_distribution:
  # How to split daily macros across meals by percentage
  default:
    two_meals: [45, 55]
    three_meals: [30, 40, 30]
    four_meals: [25, 30, 25, 20]
    if_16_8: [40, 35, 25]  # lunch, snack, dinner

workout_library:
  # Template blocks assembled by equipment + days/week
  splits:
    full_body_3d:
      days: 3
      sessions:
        - name: Full Body A
          blocks:
            - type: compound
              rest_seconds: 90
              exercises:
                - {name: Back Squat (or Goblet Squat), sets: 4, reps: "6-8"}
                - {name: Bench Press (or DB Press), sets: 4, reps: "6-8"}
                - {name: Barbell Row (or 1-Arm DB Row), sets: 3, reps: "8-10"}
            - type: accessory
              rest_seconds: 60
              exercises:
                - {name: Romanian Deadlift, sets: 3, reps: "8-10"}
                - {name: Lateral Raise, sets: 3, reps: "12-15"}
                - {name: Plank, sets: 3, reps: "45-60s"}
        - name: Full Body B
          blocks:
            - type: compound
              rest_seconds: 90
              exercises:
                - {name: Deadlift (or Hip Hinge DB), sets: 3, reps: "5-6"}
                - {name: Overhead Press (or DB), sets: 4, reps: "6-8"}
                - {name: Pull-up/Lat Pulldown, sets: 4, reps: "6-8"}
            - type: accessory
              rest_seconds: 60
              exercises:
                - {name: Bulgarian Split Squat, sets: 3, reps: "8-10"}
                - {name: Cable/DB Fly, sets: 3, reps: "10-12"}
                - {name: Hanging Knee Raise, sets: 3, reps: "10-15"}
        - name: Full Body C
          blocks:
            - type: compound
              rest_seconds: 90
              exercises:
                - {name: Front Squat (or DB Split Squat), sets: 4, reps: "6-8"}
                - {name: Incline DB Press, sets: 4, reps: "8-10"}
                - {name: Seated Row/Cable Row, sets: 3, reps: "8-10"}
            - type: accessory
              rest_seconds: 60
              exercises:
                - {name: Hip Thrust, sets: 3, reps: "8-12"}
                - {name: Face Pull, sets: 3, reps: "12-15"}
                - {name: Side Plank, sets: 3, reps: "30-45s/side"}
    ppl_5d:
      days: 5
      sessions:
        - name: Push (Chest/Shoulders/Triceps)
          blocks:
            - {type: compound, rest_seconds: 120, exercises:
                [{name: Bench Press, sets: 4, reps: "5-8"},
                 {name: Overhead Press, sets: 3, reps: "6-8"}]}
            - {type: accessory, rest_seconds: 75, exercises:
                [{name: Incline DB Press, sets: 3, reps: "8-12"},
                 {name: Lateral Raise, sets: 4, reps: "12-15"},
                 {name: Cable Pushdown, sets: 3, reps: "10-12"}]}
        - name: Pull (Back/Biceps)
          blocks:
            - {type: compound, rest_seconds: 120, exercises:
                [{name: Weighted Pull-up or Pulldown, sets: 4, reps: "6-8"},
                 {name: Barbell Row, sets: 4, reps: "6-8"}]}
            - {type: accessory, rest_seconds: 75, exercises:
                [{name: Chest Supported Row, sets: 3, reps: "8-12"},
                 {name: Face Pull, sets: 3, reps: "12-15"},
                 {name: DB Curl, sets: 3, reps: "10-12"}]}
        - name: Legs (Quads/Hams/Glutes)
          blocks:
            - {type: compound, rest_seconds: 120, exercises:
                [{name: Back or Front Squat, sets: 4, reps: "5-8"},
                 {name: Romanian Deadlift, sets: 3, reps: "6-8"}]}
            - {type: accessory, rest_seconds: 90, exercises:
                [{name: Walking Lunge, sets: 3, reps: "10-12/leg"},
                 {name: Leg Press or Step-up, sets: 3, reps: "10-12"},
                 {name: Calf Raise, sets: 4, reps: "10-15"}]}
        - name: Upper (Volume)
          blocks:
            - {type: accessory, rest_seconds: 75, exercises:
                [{name: Incline Press, sets: 3, reps: "8-12"},
                 {name: Cable Row, sets: 3, reps: "8-12"},
                 {name: Rear Delt Fly, sets: 3, reps: "12-15"},
                 {name: Triceps Extension, sets: 3, reps: "10-12"}]}
        - name: Lower (Volume)
          blocks:
            - {type: accessory, rest_seconds: 90, exercises:
                [{name: Hack Squat/DB Squat, sets: 3, reps: "8-12"},
                 {name: Hip Thrust, sets: 3, reps: "8-12"},
                 {name: Hamstring Curl, sets: 3, reps: "10-12"},
                 {name: Calf Raise, sets: 4, reps: "10-15"}]}

  mobility_packs:
    daily_10min:
      description: Daily 10-minute mobility (hips/thoracic/ankle/shoulder)
      rounds: 3
      drills:
        - {name: 90/90 Hip Switch, reps: 10}
        - {name: Couch Stretch, reps: "45s/side"}
        - {name: Thoracic Open Book, reps: 10}
        - {name: Ankle Dorsiflexion Lunge, reps: 10}
        - {name: PVC Shoulder Dislocates (band), reps: 12}

  rehab_addons:
    shoulder:
      drills: [{name: External Rotation (band), sets: 3, reps: 15},
               {name: YTWs (light DB), sets: 3, reps: 12},
               {name: Face Pull (light), sets: 3, reps: 15}]
    back:
      drills: [{name: Bird Dog, sets: 3, reps: 12},
               {name: McGill Curl-Up, sets: 3, reps: "10-15"},
               {name: Hip Hinge PVC, sets: 3, reps: 12}]
    knee:
      drills: [{name: Step-up (low box), sets: 3, reps: 10},
               {name: Spanish Squat (band), sets: 3, reps: 12},
               {name: Hamstring Curl (band), sets: 3, reps: 12}]

meal_templates:
  omnivore:
    - name: Chicken Rice Bowl
      macros_pct: {protein: 35, carbs: 45, fat: 20}
      items:
        - {food: Chicken Breast, qty_g: "{{0.35*protein_target_g*4/4}}", note: "auto-scale to hit protein"}
        - {food: Cooked Rice, qty_g: 200}
        - {food: Olive Oil, qty_g: 10}
        - {food: Broccoli, qty_g: 120}
    - name: Eggs & Oats
      macros_pct: {protein: 30, carbs: 50, fat: 20}
      items:
        - {food: Eggs, qty_g: 150}
        - {food: Oats, qty_g: 60}
        - {food: Milk/Yogurt, qty_g: 200}
  carnivore:
    - name: Steak & Eggs
      macros_pct: {protein: 40, carbs: 0, fat: 60}
      items:
        - {food: Ribeye Steak, qty_g: 250}
        - {food: Eggs, qty_g: 120}
    - name: Salmon & Liver
      macros_pct: {protein: 45, carbs: 0, fat: 55}
      items:
        - {food: Salmon, qty_g: 200}
        - {food: Beef Liver, qty_g: 80}
  herbivore:
    - name: Tofu Stir Fry
      macros_pct: {protein: 30, carbs: 50, fat: 20}
      items:
        - {food: Firm Tofu, qty_g: 200}
        - {food: Rice Noodles, qty_g: 100}
        - {food: Mixed Veg, qty_g: 200}
        - {food: Sesame Oil, qty_g: 10}
    - name: Lentils & Rice
      macros_pct: {protein: 25, carbs: 55, fat: 20}
      items:
        - {food: Cooked Lentils, qty_g: 200}
        - {food: Cooked Rice, qty_g: 180}
        - {food: Olive Oil, qty_g: 10}

food_catalog_seed:
  proteins: [Chicken Breast, Turkey, Eggs, Greek Yogurt, Salmon, Tuna, Tofu, Tempeh, Cottage Cheese]
  carbs: [Rice, Oats, Pasta, Bread, Potato, Sweet Potato, Quinoa, Rice Noodles]
  fats: [Olive Oil, Avocado, Almonds, Peanut Butter, Butter, Tahini]
  extras: [Broccoli, Spinach, Banana, Berries, Mixed Veg, Tomato, Cucumber]

calendar_rules:
  schedule_generation:
    # Example mapping
    3_days_full_body: [Mon, Wed, Fri]
    5_days_ppl: [Mon, Tue, Thu, Fri, Sat]
  notifications:
    lead_minutes: 10
    categories: [meal, workout, sleep]

qa_limits:
  text_overflow:
    chips_max_width_pct: 25
    chip_text_max_lines: 1
  numeric_format:
    decimals_max: 1
    trim_trailing_zero: true